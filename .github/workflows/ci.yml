name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck + tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: bubblewrap (lets the Linux sandbox tests run when the runner allows user namespaces)
        run: sudo apt-get install -y bubblewrap || true
      - name: find hanging test files
        run: |
          for f in test/*.test.ts; do
            if ! timeout 100 node --no-warnings --test "$f" > /tmp/out.txt 2>&1; then echo "=== FAILED OR HUNG: $f (exit $?)"; grep -E '^(not ok|# Subtest|✖)' /tmp/out.txt | tail -5; tail -5 /tmp/out.txt; fi
          done

  terminal:
    name: real-terminal tests (pseudo-terminal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 test/pty/tui.py
