<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amness</title>
  <link rel="icon" href="mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The same picture as the window's start screen (splash.html), finished, so the handover is seamless; it fades out when the first state arrives (app.js). -->
  <div id="boot" class="boot" role="status" aria-label="Amness is starting"><img class="boot-mark" src="mark.svg" alt=""><div class="boot-name">Amness</div><div class="boot-tag">reliable agents for any model</div><div class="boot-bar"></div></div>
  <div id="app" class="app panel-open sidebar-open">
    <header class="topbar" id="topbar">
      <!-- Icons: Lucide (https://lucide.dev), ISC License, Copyright (c) Lucide Contributors -->
      <button id="toggleSidebar" class="icon-btn" title="Sidebar (Ctrl/⌘ B)" aria-label="Toggle sidebar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>
      <button id="projectBtn" class="crumb project" title="Project">
        <img class="logo" src="mark.svg" alt="" width="18" height="18"><span id="projectName">…</span><span class="caret">▾</span>
      </button>
      <span class="crumb-sep">/</span>
      <button id="titleBtn" class="crumb title" title="Rename this conversation"><span id="sessionTitle">New conversation</span></button>
      <div class="spacer"></div>
      <button id="paletteBtn" class="command-center" title="Search or run a command (Ctrl/⌘ K)" aria-label="Search or run a command"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span class="cc-text">Search or run a command</span><kbd class="cc-key" id="paletteKey">⌘K</kbd></button>
      <div class="spacer"></div>
      <div class="segmented" id="modeSwitch" role="radiogroup" aria-label="Permission mode">
        <button data-mode="default" title="Ask before edits and commands">Ask</button>
        <button data-mode="acceptEdits" title="Edits apply automatically; commands still ask">Auto-edit</button>
        <button data-mode="plan" title="Read and plan only; no changes">Plan</button>
        <button data-mode="yolo" title="Everything runs without asking (the safety floor still applies)">Yolo</button>
      </div>
      <button id="modelBtn" class="model-chip" data-tip="Model and provider"><span class="model-dot"></span><span id="modelName">…</span><span class="caret">▾</span></button>
      <span class="tb-sep" aria-hidden="true"></span>
      <button id="expandBtn" class="icon-btn" title="Expand all tool output and thinking (Ctrl/⌘ E)" aria-label="Expand all"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg></button>
      <button id="newBtn" class="icon-btn" title="New conversation (Ctrl/⌘ N)" aria-label="New conversation"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg></button>
      <button id="prefsBtn" class="labeled-btn" title="Settings (Ctrl/⌘ ,)" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span class="lb-text">Settings</span></button>
      <button id="togglePanel" class="icon-btn" title="Workspace panel (Ctrl/⌘ J)" aria-label="Toggle workspace panel"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg></button>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="tabs" role="tablist">
        <button data-tab="chats" class="on" role="tab" title="Your conversations in this project">Chats</button>
        <button data-tab="files" role="tab" title="The project's files. Click one to view it (Ctrl/⌘ P)">Files</button>
      </div>
      <div class="tab-body" id="chatsTab">
        <div class="search"><input id="sessionSearch" type="search" placeholder="Search conversations" autocomplete="off"></div>
        <div id="sessionList" class="list"></div>
        <div id="sessionPreview" class="preview hidden"></div>
      </div>
      <div class="tab-body hidden" id="filesTab">
        <div class="search"><input id="fileFilter" type="search" placeholder="Filter files" autocomplete="off"></div>
        <div id="fileTree" class="tree"></div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="transcript" id="transcript">
        <div class="transcript-inner">
          <div id="empty" class="empty hidden">
            <img class="empty-logo" src="mark.svg" alt="" width="56" height="56">
            <h1>What should we work on?</h1>
            <p class="muted" id="emptyProject"></p>
            <div class="starters" id="starters"></div>
          </div>
          <div id="blocks"></div>
        </div>
      </div>
      <button id="jumpBottom" class="jump hidden" title="Scroll to the newest message">↓ Jump to latest</button>
      <div class="composer-wrap">
        <div class="status hidden" id="status">
          <div class="status-row"><span class="spinner"></span><span id="statusText" class="status-text">Working…</span><span class="spacer"></span><button id="stopBtn" class="btn small danger" title="Stop the agent safely after the current step (Esc)">Stop</button></div>
          <div id="statusQueue"></div>
        </div>
        <div class="composer" id="composer">
          <div id="mentionMenu" class="menu hidden" role="listbox"></div>
          <textarea id="input" rows="1" placeholder="Ask anything…" spellcheck="true"></textarea>
          <div class="composer-row">
            <button id="attachBtn" class="ghost-btn" title="Attach an image (or paste / drop one)">＋ Image</button>
            <span class="muted small" id="composerHint">/ commands · @ files · !shell · #remember · Shift+Enter new line · Shift+Tab mode</span>
            <span class="spacer"></span>
            <button id="sendBtn" class="send" title="Send (Enter)">Send ↵</button>
          </div>
        </div>
      </div>
    </main>

    <section class="viewer hidden" id="viewer" aria-label="File">
      <header>
        <span class="viewer-path" id="viewerPath"></span>
        <span class="muted small" id="viewerMeta"></span>
        <span class="spacer"></span>
        <button id="viewerMention" class="btn small" title="Mention this file in your message">@ Mention</button>
        <button id="viewerEditor" class="btn small" title="Open this file in your own editor">Open in editor</button>
        <button id="viewerClose" class="icon-btn" aria-label="Close file" title="Close the file view">✕</button>
      </header>
      <div class="code-view" id="viewerCode"></div>
    </section>

    <aside class="panel" id="panel" aria-label="Workspace"></aside>
    <div class="scrim for-panel" id="scrimPanel"></div>
    <div class="scrim for-side" id="scrimSide"></div>
  </div>

  <div id="prefsRoot"></div>
  <div id="modalRoot"></div>
  <div id="toasts" class="toasts"></div>
  <input type="file" id="fileInput" accept="image/*" hidden>
  <script src="app.js"></script>
</body>
</html>
